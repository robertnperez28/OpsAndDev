apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspnetapp-web
  labels:
    app: aspnetapp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aspnetapp-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aspnetapp-web
    spec:
      containers:
        - name: web
          image: robertnperez/aspnetapp-flbetances:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_HOST
              value: "mssql"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: SA_PASSWORD
            - name: ConnectionStrings__Default
              value: "Server=$(DB_HOST),1433;Database=AppDb;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: aspnetapp-web
  labels:
    app: aspnetapp-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: aspnetapp-web
