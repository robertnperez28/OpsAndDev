# =====================================================================
# Azure DevOps Pipeline - SUCCESS scenario
# Project: Prueba-Dummy DevOps Senior - FLBetances
# Author: Robert Perez
#
# Stages:
#   1. SonarQube Analysis (Quality Gate must PASS)
#   2. Build & Push Docker image to Docker Hub
#   3. Parallel jobs (Hello World + File generation)
#   4. Deploy to Kubernetes (Minikube) using Kustomize
# =====================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - FLBetances/**

pr:
  branches:
    include:
      - main

pool:
  name: SelfHostedPool

variables:
  # --- Image / Registry ---
  dockerRegistryServiceConnection: 'DockerHub-Connection'
  imageRepository: 'robertnperez/aspnetapp-flbetances'
  # SemVer-style tag: vMAJOR.MINOR.<BuildId> — bump MAJOR/MINOR on releases
  majorVersion: '1'
  minorVersion: '0'
  imageTag: 'v$(majorVersion).$(minorVersion).$(Build.BuildId)'
  dockerfilePath: 'FLBetances/src/app/aspnetapp/Dockerfile'
  dockerBuildContext: 'FLBetances/src/app/aspnetapp'

  # --- SonarQube ---
  # NOTE: We bypass the SonarQube extension tasks (which auto-inject branch
  # info incompatible with Community Edition) and call the scanner CLI directly.
  # SONAR_HOST_URL and SONAR_TOKEN must be defined as pipeline variables
  # (mark SONAR_TOKEN as secret).
  sonarProjectKey: 'Prueba-Dummy-FLBetances'
  sonarProjectName: 'Prueba-Dummy-FLBetances'

  # --- .NET ---
  buildConfiguration: 'Release'
  solutionPath: 'FLBetances/src/app/aspnetapp.sln'
  projectPath: 'FLBetances/src/app/aspnetapp/aspnetapp.csproj'

  # --- Kubernetes ---
  kustomizeOverlay: 'FLBetances/environment/overlays/dev'

stages:
# =====================================================================
# STAGE 1: SonarQube Analysis + Build
# =====================================================================
- stage: SonarQubeAnalysis
  displayName: 'SonarQube Analysis & Build'
  jobs:
    - job: AnalyzeAndBuild
      displayName: 'Analyze with SonarQube and build .NET app'
      steps:
        # Full clone (depth 0) so SonarQube can compute git blame info
        # and attribute issues to the correct authors/commits.
        - checkout: self
          fetchDepth: 0

        # Self-hosted agent already has .NET 8 SDK installed.
        # We just verify it as a precondition (fail fast if missing).
        - powershell: |
            dotnet --version
            if ($LASTEXITCODE -ne 0) {
              Write-Error ".NET SDK not found on agent. Install .NET 8 SDK and restart the agent."
              exit 1
            }
          displayName: 'Verify .NET SDK is installed'

        # NOTE: We use the SonarScanner CLI directly instead of the SonarQube
        # tasks (v5/v7) because:
        #   - v7 auto-injects sonar.branch.name (unsupported by Community Ed.)
        #   - v5 is no longer published in the SonarSource extension
        # This approach is fully transparent and works on any edition.
        - task: DotNetCoreCLI@2
          displayName: 'Install dotnet-sonarscanner global tool'
          inputs:
            command: 'custom'
            custom: 'tool'
            arguments: 'install --global dotnet-sonarscanner'

        - task: DotNetCoreCLI@2
          displayName: 'Restore NuGet packages'
          inputs:
            command: 'restore'
            projects: '$(projectPath)'

        - task: PowerShell@2
          displayName: 'SonarScanner: Begin'
          env:
            SONAR_HOST_URL: $(SONAR_HOST_URL)
            SONAR_TOKEN: $(SONAR_TOKEN)
          inputs:
            targetType: 'inline'
            script: |
              if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
                Write-Error "Pipeline variable SONAR_HOST_URL is not defined."
                exit 1
              }
              if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
                Write-Error "Pipeline variable SONAR_TOKEN is not defined or not marked as secret."
                exit 1
              }
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              Write-Host "Using SonarQube at: $env:SONAR_HOST_URL"
              dotnet sonarscanner begin `
                /k:"$(sonarProjectKey)" `
                /n:"$(sonarProjectName)" `
                /d:sonar.host.url="$env:SONAR_HOST_URL" `
                /d:sonar.token="$env:SONAR_TOKEN" `
                /d:sonar.exclusions="**/wwwroot/lib/**,**/bin/**,**/obj/**,**/*.min.js,**/*.min.css" `
                /d:sonar.qualitygate.wait=true `
                /d:sonar.scanner.scanAll=false
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - task: DotNetCoreCLI@2
          displayName: 'Build solution'
          inputs:
            command: 'build'
            projects: '$(projectPath)'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: PowerShell@2
          displayName: 'SonarScanner: End (waits for Quality Gate)'
          env:
            SONAR_TOKEN: $(SONAR_TOKEN)
          inputs:
            targetType: 'inline'
            script: |
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# =====================================================================
# STAGE 2: Docker Build & Push
# =====================================================================
- stage: DockerBuildPush
  displayName: 'Build & Push Docker image'
  dependsOn: SonarQubeAnalysis
  condition: succeeded()
  jobs:
    - job: BuildAndPush
      displayName: 'Build and push image to Docker Hub'
      steps:
        - powershell: |
            Write-Host "==> Image to be built:"
            Write-Host "    $(imageRepository):$(imageTag)"
            Write-Host "    $(imageRepository):latest"
          displayName: 'Show image tags'

        - task: Docker@2
          displayName: 'Build Docker image'
          inputs:
            command: 'build'
            repository: '$(imageRepository)'
            dockerfile: '$(dockerfilePath)'
            buildContext: '$(dockerBuildContext)'
            tags: |
              $(imageTag)
              latest

        - task: Docker@2
          displayName: 'Push Docker image to Docker Hub'
          inputs:
            command: 'push'
            containerRegistry: '$(dockerRegistryServiceConnection)'
            repository: '$(imageRepository)'
            tags: |
              $(imageTag)
              latest

# =====================================================================
# STAGE 3: Parallel utility jobs (requirement 6.a and 6.b)
# =====================================================================
- stage: ParallelJobs
  displayName: 'Parallel utility jobs (Hello World + File generation)'
  dependsOn: DockerBuildPush
  condition: succeeded()
  jobs:
    # --- Job A: Hello World x10 in parallel ---
    - job: HelloWorldParallel
      displayName: 'Hello World x10 (parallel matrix)'
      strategy:
        parallel: 10
      steps:
        - powershell: |
            FLBetances/scripts/hello-world.ps1 -Iteration "$env:SYSTEM_JOBPOSITIONINPHASE"
          displayName: 'Print Hola Mundo'

    # --- Job B: Create 10 files with date and print them ---
    - job: GenerateFiles
      displayName: 'Create 10 files with date and print contents'
      steps:
        - powershell: |
            FLBetances/scripts/create-files.ps1 -OutputDir "$(Agent.TempDirectory)/generated-files"
          displayName: 'Generate and display files'

# =====================================================================
# STAGE 4: Deploy to Kubernetes (Minikube)
# =====================================================================
- stage: DeployK8s
  displayName: 'Deploy to Kubernetes (Minikube)'
  dependsOn:
    - DockerBuildPush
    - ParallelJobs
  condition: succeeded()
  jobs:
    - deployment: DeployToMinikube
      displayName: 'Deploy via Kustomize'
      environment: 'minikube-dev'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: PowerShell@2
                displayName: 'Update image tag in Kustomize overlay'
                env:
                  KUBECONFIG: 'C:\agent\.kube\config'
                inputs:
                  targetType: 'inline'
                  script: |
                    cd FLBetances/environment/overlays/dev
                    kubectl kustomize . > rendered-before.yaml
                    Write-Host "==> Rendered manifest preview:"
                    Get-Content rendered-before.yaml | Select-Object -First 30

                    # Update image tag dynamically
                    (Get-Content kustomization.yaml) `
                      -replace 'newTag: .*', 'newTag: $(imageTag)' `
                      | Set-Content kustomization.yaml

                    Write-Host "==> Updated kustomization.yaml:"
                    Get-Content kustomization.yaml

              - task: PowerShell@2
                displayName: 'Apply manifests to Minikube'
                env:
                  # Self-hosted agent runs as NETWORK SERVICE, which has no
                  # user profile. Point kubectl to a kubeconfig copy that the
                  # service account can read (placed under the agent dir).
                  KUBECONFIG: 'C:\agent\.kube\config'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "==> KUBECONFIG: $env:KUBECONFIG"
                    Write-Host "==> Current kubectl context:"
                    kubectl config current-context

                    Write-Host "==> Applying Kustomize overlay..."
                    kubectl apply -k FLBetances/environment/overlays/dev

                    Write-Host "==> Waiting for rollout..."
                    kubectl rollout status deployment/dev-aspnetapp-web -n aspnetapp-dev --timeout=300s

                    Write-Host "==> Resources deployed:"
                    kubectl get all -n aspnetapp-dev
                    kubectl get ingress -n aspnetapp-dev

              - task: PowerShell@2
                displayName: 'Smoke test'
                env:
                  KUBECONFIG: 'C:\agent\.kube\config'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "==> Pod status:"
                    kubectl get pods -n aspnetapp-dev -o wide

                    Write-Host "==> Service endpoints:"
                    kubectl get endpoints -n aspnetapp-dev

                    Write-Host ""
                    Write-Host "==> To access the app, run on host machine:"
                    Write-Host "    minikube tunnel"
                    Write-Host "    Add to hosts file: 127.0.0.1 aspnetapp.local"
                    Write-Host "    Open: http://aspnetapp.local"
