# =====================================================================
# Azure DevOps Pipeline - FAILURE scenario
# Project: Prueba-Dummy DevOps Senior - FLBetances
#
# Purpose: Demonstrate SonarQube blocking the pipeline when code
#          contains intentional bugs, code smells or security issues.
#
# How it triggers a failure:
#   - Uses a separate folder (FLBetances/src-bad/) with intentional issues
#   - The Quality Gate is configured with sonar.qualitygate.wait=true
#   - When the gate fails, the entire stage fails and Docker/K8s never run
# =====================================================================

trigger: none   # Manual trigger only (avoid running on every push)

pool:
  name: SelfHostedPool

variables:
  # SONAR_HOST_URL and SONAR_TOKEN come from pipeline variables.
  sonarProjectKey: 'Prueba-Dummy-FLBetances-FAILED'
  sonarProjectName: 'Prueba-Dummy-FLBetances-FAILED'
  buildConfiguration: 'Release'
  badProjectPath: 'FLBetances/src-bad/aspnetapp/aspnetapp.csproj'

stages:
- stage: SonarQubeAnalysisFails
  displayName: 'SonarQube Analysis (expected to FAIL)'
  jobs:
    - job: AnalyzeBadCode
      displayName: 'Analyze code with intentional issues'
      steps:
        # Self-hosted agent already has .NET 8 SDK installed (verified as precondition).
        - powershell: |
            dotnet --version
            if ($LASTEXITCODE -ne 0) {
              Write-Error ".NET SDK not found on agent. Install .NET 8 SDK and restart the agent."
              exit 1
            }
          displayName: 'Verify .NET SDK is installed'

        - task: DotNetCoreCLI@2
          displayName: 'Install dotnet-sonarscanner global tool'
          inputs:
            command: 'custom'
            custom: 'tool'
            arguments: 'install --global dotnet-sonarscanner'

        - task: DotNetCoreCLI@2
          displayName: 'Restore'
          inputs:
            command: 'restore'
            projects: '$(badProjectPath)'

        - task: PowerShell@2
          displayName: 'SonarScanner: Begin (strict gate)'
          env:
            SONAR_HOST_URL: $(SONAR_HOST_URL)
            SONAR_TOKEN: $(SONAR_TOKEN)
          inputs:
            targetType: 'inline'
            script: |
              if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
                Write-Error "Pipeline variable SONAR_HOST_URL is not defined."
                exit 1
              }
              if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
                Write-Error "Pipeline variable SONAR_TOKEN is not defined or not marked as secret."
                exit 1
              }
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              Write-Host "Using SonarQube at: $env:SONAR_HOST_URL"
              dotnet sonarscanner begin `
                /k:"$(sonarProjectKey)" `
                /n:"$(sonarProjectName)" `
                /d:sonar.host.url="$env:SONAR_HOST_URL" `
                /d:sonar.token="$env:SONAR_TOKEN" `
                /d:sonar.exclusions="**/wwwroot/lib/**,**/bin/**,**/obj/**" `
                /d:sonar.qualitygate.wait=true
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - task: DotNetCoreCLI@2
          displayName: 'Build (with bad code)'
          inputs:
            command: 'build'
            projects: '$(badProjectPath)'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: PowerShell@2
          displayName: 'SonarScanner: End (waits for Quality Gate, expected FAIL)'
          env:
            SONAR_TOKEN: $(SONAR_TOKEN)
          inputs:
            targetType: 'inline'
            script: |
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# These stages will NEVER run because the Quality Gate above fails.
# This proves the gate effectively blocks the pipeline.
- stage: ShouldNeverRun
  displayName: 'This stage should be skipped'
  dependsOn: SonarQubeAnalysisFails
  condition: succeeded()
  jobs:
    - job: NeverExecutes
      steps:
        - powershell: Write-Host "If you see this, the gate did not block correctly."
